<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title description">
<title id="title">QLD Service Intelligence architecture</title>
<desc id="description">Public population and emergency department CSV snapshots are bundled in one Railway-hosted Spring Boot application. Separate parsers feed separate analytics and REST APIs. Startup importers reuse the parsers and persist through Spring Data JPA to Railway PostgreSQL, which is not the analytics read source. The same application serves the interactive dashboard to browsers over public HTTPS. No hospital-to-LGA mapping is used.</desc>
